<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mega Fearless Drafter - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Fearless Draft (Series)</h1>
<button onclick="startNewGame()">Create a Fearless series</button> <!-- Starts a new game and generates a random game id-->
<button onclick="joinGame()">Join a Fearless series</button> <!-- Allows the user to join an existing game by entering a game id -->
<button onclick="loadDraft()">Load a draft</button> <!-- Allows the user to paste something that acts as a previous draft ids -->

<script src="script.js"></script>
</body>
</html>
