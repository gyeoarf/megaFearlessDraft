<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fearless Draft</title>
  <link rel="stylesheet" href="draft.css" />
</head>
<body>
<div class="draft-wrapper">

  <div class="team-column blue-team">
    <h2>Blue</h2>
    <div class="slots">
      <div class="slot">B1</div>
      <div class="slot">B2</div>
      <div class="slot">B3</div>
      <div class="slot">B4</div>
      <div class="slot">B5</div>
    </div>
  </div>

  <div class="center-draft">
    <div class="role-filter">
      <!-- Icons or filters -->
    </div>
    <input type="text" id="search" placeholder="Search champion..." />
    <div id="champion-pool" class="champion-grid">
      <!-- Champion icons go here -->
    </div>
    <div class="draft-order">
      <div>1</div><div>3</div><div>5</div><div>8</div><div>10</div>
      <button class="ready-btn">Ready</button>
      <div>9</div><div>7</div><div>6</div><div>4</div><div>2</div>
    </div>
  </div>

  <div class="team-column red-team">
    <h2>Red</h2>
    <div class="slots">
      <div class="slot">R1</div>
      <div class="slot">R2</div>
      <div class="slot">R3</div>
      <div class="slot">R4</div>
      <div class="slot">R5</div>
    </div>
  </div>

</div>

<script src="draft.js"></script>
</body>
</html>
